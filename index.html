<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Watch & Download Movies</title>
    <link rel="stylesheet" href="style.css">
</head>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
    
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">🎬 CineFlix</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="filterMovies()">
        </div>
    </header>

    <!-- Genre Filter Section -->
    <section class="filters">
        <button class="filter-btn active" onclick="filterGenre('all')">All</button>
        <button class="filter-btn" onclick="filterGenre('Action')">Action</button>
        <button class="filter-btn" onclick="filterGenre('Sci-Fi')">Sci-Fi</button>
        <button class="filter-btn" onclick="filterGenre('Drama')">Drama</button>
    </section>

    <!-- Main Movie Grid -->
    <main class="container">
        <h2>Featured Movies</h2>
        <div class="movie-grid" id="movieContainer">
            <!-- Movie Cards JavaScript se dynamically load honge -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
