<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - CineFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html" style="color:#e50914; text-decoration:none;">🎬 CineFlix</a></div>
    </header>

    <main class="container" style="text-align: center; max-width: 600px; margin: 40px auto;">
        <div id="loadingText" style="color:#aaa;">Loading movie details...</div>
        <div id="movieDetailsCard" style="display:none;">
            <img id="detailPoster" src="" alt="Poster" style="width:100%; max-width:300px; border-radius:10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <h1 id="detailTitle" style="margin-top:20px;"></h1>
            <p id="detailMeta" style="color:#aaa; margin:10px 0;"></p>
            
            <div style="margin-top: 30px;">
                <a id="detailDownloadBtn" href="#" target="_blank" class="download-btn" style="padding: 12px 25px; font-size: 18px; display: inline-block;">⬇ Download Movie</a>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCRRiS5R-os-NlLvYwsihU4QJ3zyf0zfBk",
          authDomain: "cineflix-96103.firebaseapp.com",
          projectId: "cineflix-96103",
          storageBucket: "cineflix-96103.firebasestorage.app",
          messagingSenderId: "911831817405",
          appId: "1:911831817405:web:cb0b86146b7e52742b6bd4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get Movie ID from URL (e.g. movie.html?id=DOCUMENT_ID)
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (movieId) {
            db.collection("movies").doc(movieId).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const genreText = Array.isArray(data.genre) ? data.genre.join(', ') : data.genre;

                    document.getElementById('detailPoster').src = data.poster;
                    document.getElementById('detailTitle').innerText = data.title;
                    document.getElementById('detailMeta').innerText = (data.year || '') + ' | ' + genreText;
                    document.getElementById('detailDownloadBtn').href = data.downloadLink;

                    document.getElementById('loadingText').style.display = 'none';
                    document.getElementById('movieDetailsCard').style.display = 'block';
                } else {
                    document.getElementById('loadingText').innerText = "Movie not found!";
                }
            }).catch((error) => {
                document.getElementById('loadingText').innerText = "Error loading movie: " + error.message;
            });
        } else {
            document.getElementById('loadingText').innerText = "Invalid Movie Link!";
        }
    </script>
</body>
</html>
